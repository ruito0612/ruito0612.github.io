});

<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>Typing</title></head>
<body style="background:#000;color:white;text-align:center">
<h2>タイピング</h2>
<p id="q"></p>
<input id="i" autofocus>
<p id="s"></p>

<script>
const words=["sakura","nihon","gakkou","tokyo","sensei","kuruma","densha","kaze","yama","umi"];
let idx=0,miss=0;
q.textContent=words[idx];

i.oninput=()=>{
 if(words[idx].startsWith(i.value)) return;
 miss++; i.value="";
 if(miss>=5){alert("ゲームオーバー");location.href="index.html";}
};

i.onkeydown=e=>{
 if(e.key==="Enter"){
  if(i.value===words[idx]){
    idx++; i.value="";
    if(idx>=10){alert("クリア！");location.href="index.html";}
    q.textContent=words[idx];
  }
 }
};
</script>
</body></html>
